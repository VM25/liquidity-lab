# Netlify build settings for the website, https://liquidityparadox.netlify.app.
# The site is the Next.js app in web/. Netlify detects Next.js and applies its Next.js runtime automatically; no
# adapter or plugin is pinned here. Every push to main builds and publishes production; deploy previews and branch
# deploys are built without indexing (see web/src/site.ts).

[build]
  base = "web"
  # npm run build = prebuild (equations, frozen PDFs checked against docs/memo/FROZEN.sha256) + next build + integrity lint
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
