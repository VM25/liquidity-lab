[project]
name = "lpx"
version = "0.1.0"
description = "The Liquidity Paradox: research engine for predictive alpha, adverse selection and inventory risk in electronic market making"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=16",
    "duckdb>=1.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "numba>=0.60",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
