# Dataset Acceptance Test 001b — history extension for the candidate canonical instrument (Binance spot SOLUSDT).
# Regime held fixed across the sample: tick 0.01, lot 0.001, Tardis microsecond exchange timestamps (since 2025-02-28),
# depth@100ms. All free first-of-month days from 2025-03-01 to 2026-05-01 (2026-06..10 already in acquisition_001).

[tardis]
base_url = "https://datasets.tardis.dev/v1"
exchange = "binance"
symbols = ["SOLUSDT"]
dates = ["2025-03-01", "2025-04-01", "2025-05-01", "2025-06-01", "2025-07-01", "2025-08-01", "2025-09-01",
         "2025-10-01", "2025-11-01", "2025-12-01", "2026-01-01", "2026-02-01", "2026-03-01", "2026-04-01", "2026-05-01"]
data_types = ["incremental_book_L2", "trades", "quotes"]

[binance_vision]
base_url = "https://data.binance.vision/data/spot/daily/trades"
symbols = ["SOLUSDT"]
dates = ["2025-03-01", "2025-04-01", "2025-05-01", "2025-06-01", "2025-07-01", "2025-08-01", "2025-09-01",
         "2025-10-01", "2025-11-01", "2025-12-01", "2026-01-01", "2026-02-01", "2026-03-01", "2026-04-01", "2026-05-01"]
