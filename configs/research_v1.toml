# Research design v1 — FROZEN 2026-10-14, before any markout, forecast or policy outcome was computed.
# AMENDED 2026-10-19 (audit response; DECISIONS.md change log). At amendment time no E001 outcome had been computed on
# any session (no results/e001 exists at baseline commit 8731ea6 or at the amending commit); test-session outcomes remain sealed.
# Changes require a DECISIONS.md change-log entry stating what changed, why, and whether held-out data had been seen.

[dataset]
venue = "binance-spot"
symbol = "SOLUSDT"
source_book = "tardis"                 # incremental_book_L2, replayed by lpx.book.engine
source_trades = "binance_vision"       # exchange trade archive: complete ids, verified aggressor flag
validity_layer = "joint"               # results/acceptance_001/windows.csv: book proven AND trade record complete
acceptance_git_commit = "50807dc1219d4d1de8650bcbd8e2768202695748"   # Test 001 rerun of record (results/acceptance_001/summary.json)

[splits]
# Chronological, by session (day). Test sessions are held out: nothing is fitted, tuned or inspected on them
# before the Stage 4 close-out, when every frozen experiment is run on them once.
train = ["2025-03-01", "2025-04-01", "2025-05-01", "2025-06-01", "2025-07-01", "2025-08-01", "2025-09-01",
         "2025-10-01", "2025-11-01", "2025-12-01"]
validation = ["2026-01-01", "2026-02-01", "2026-03-01", "2026-04-01", "2026-05-01"]
test = ["2026-06-01", "2026-07-01", "2026-08-01", "2026-09-01", "2026-10-01"]
# Known shift: relative tick is 0.46-0.80 bp in train, 0.80-1.20 bp in validation, 0.85-1.37 bp in test.
# Disclosure: selection of the instrument and sample was NOT blind to the test sessions. Acceptance coverage, data
# quality and tick regimes of all 20 sessions (including the 5 test sessions) informed the choice of SOLUSDT and of the
# sample regime. Only test-session *outcomes* (markouts, forecasts, policy results) are sealed.

[e001]
# Observed signed post-trade markouts. No hypothetical fills.
discovery_sessions = ["train", "validation"]   # confirmation on "test" at close-out with identical code
# Event unit. Binance publishes no parent-order id: a timestamp-side cluster (trades sharing trade time T and aggressor
# side) is NOT a verified aggressive order. Amended 2026-10-19: renamed from "taker_order"; per-trade sensitivity added.
unit_primary = "ts_side_cluster"
unit_sensitivity = ["trade"]
sign = "exchange_flag"       # +1 buyer-initiated, -1 seller-initiated (Binance is_buyer_maker)
# Information clock. Amended 2026-10-19: the primary is explicitly retrospective exchange-time conditioning (book as the
# exchange published it before T: last state with E < T; outcome last state with E <= T + h) and must not be read as a
# live participant's information set. Availability-safe variants use the Tardis recorder's receipt time plus a delay.
timing_primary = "exchange"
timing_sensitivity = ["receipt+0ms", "receipt+50ms", "receipt+200ms"]
# Amended 2026-10-19 (code review, before any outcome): the delay applies to the pre-event information only; outcomes are
# always the exchange-clock state at exactly T + h, so every timing variant measures the same horizons.
horizons_s = [1, 5, 30]                                   # primary (RESEARCH_SPEC)
secondary_horizons_s = [0.1, 60]                          # descriptive only
exclude_if = "selected pre-event or any primary-horizon outcome record invalid, or T, T + h and the records not in one joint window"
# Primary metrics (bp of pre-event mid m0; s = sign; P = event VWAP):
#   signed markout       mo(h) = s * (m(T+h) - m0) / m0
#   effective spread     es    = 2 s (P - m0) / m0
#   realized spread      rs(h) = 2 s (P - m(T+h)) / m0          (es = rs(h) + 2 mo(h))
primary_metrics = ["mo", "es", "rs"]
# Conditioning cells (pre-declared; all cells reported, none selected post hoc):
#   size: event base-asset quantity terciles, thresholds fitted on train sessions only
#   touch_imbalance: (q_bid1 - q_ask1)/(q_bid1 + q_ask1) pre-event, signed by s; bins (-1,-1/3], (-1/3,1/3), [1/3,1)
#   qty_ge_touch: event quantity >= pre-event touch quantity on the side it hits. A PROXY, not observed queue depletion
#     (amended 2026-10-19: renamed from "depletes_touch"); validated descriptively against the observed touch move.
conditioning = ["size", "touch_imbalance", "qty_ge_touch"]
inference_unit = "session"            # 15 discovery sessions; correlated events are not independent trials
bootstrap_resamples = 10000           # session-level bootstrap, 95% percentile interval
block_s = 300                         # per-session 5-minute block bootstrap
block_bootstrap_resamples = 2000
seed = 20261014
# Exploratory robustness (added 2026-10-19; reported, never used to redefine the primary):
#   eligibility: configs/eligibility_v1.toml (declared after acceptance coverage was seen)
#   window variants from results/acceptance_001/windows_sensitivity.csv (stricter proven regions; other silence cuts)
window_variants = ["silence_s=0.5", "silence_s=2", "silence_s=5", "proven_levels=800", "proven_levels=600", "proven_levels=400"]
