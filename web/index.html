<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<script>
/* One entrance for the home hero, only where it can play: motion allowed, the tab visible, and once per visit. Without this class, or
   without JavaScript, the hero renders in its final state; the class is removed after the entrance either way. */
(function () { try {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || document.visibilityState !== 'visible') return;
  if (sessionStorage.getItem('lp-intro')) return; /* once per visit, not on every return to Home */
  sessionStorage.setItem('lp-intro', '1');
  var d = document.documentElement; d.classList.add('intro');
  setTimeout(function () { d.classList.remove('intro'); }, 1600);
} catch (e) {} })();
</script>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<title>The Liquidity Paradox</title>
<meta name="description" content="Pre-registered research on Binance SOLUSDT: short-horizon order-book forecasts had real skill, yet every passive quoting rule tested lost money at the attainable fee.">
</head>
